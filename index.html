<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b0d26">
<title>Untukmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Figtree:wght@400;500;600&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

<!-- =====================================================================
     BAGIAN 1 - GAYA (CSS)
     Cerita warna: pagi keemasan (hero) -> senja (galeri & doa) -> malam (tiup lilin)
     ===================================================================== -->
<style>
:root{
  --peach:#ffe2d3; --rose:#ffc4d0; --orchid:#eebfe3; --lilac:#c9b3ef;
  --night:#1b0d26; --gold:#ffc46b; --berry:#b3234f; --plum:#2b1235;
  --display:"Fraunces", Georgia, serif;
  --hand:"Kalam", "Segoe Print", "Bradley Hand", cursive;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.7;color:var(--plum);background:var(--night);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden;height:100dvh}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.night :focus-visible,.gate :focus-visible{outline-color:var(--gold)}

/* Seluruh halaman = satu hari yang berjalan dari pagi ke senja */
main{background:linear-gradient(180deg,#ffe2d3 0%,#ffc9d4 20%,#eebfe3 46%,#c9b3ef 74%,#a794e6 100%)}

.hand{font-family:var(--hand);font-weight:400}
.wrap{width:min(100% - 40px,680px);margin-inline:auto}
.section{padding:84px 0}
.marg{display:inline-block;font-family:var(--hand);font-size:22px;color:var(--berry);transform:rotate(-2deg);margin-bottom:4px}
.marg.gold{color:var(--gold)}
.title{font-family:var(--display);font-weight:600;font-size:clamp(32px,9vw,48px);line-height:1.12;letter-spacing:-.01em;color:var(--plum)}
.title.light{color:var(--peach)}
.lead{margin-top:14px;max-width:34em;color:rgba(43,18,53,.82)}
.lead.light{color:rgba(255,226,211,.84);margin-inline:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .25s var(--ease),opacity .25s,background .25s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-gold{background:var(--gold);color:var(--night);box-shadow:0 10px 30px rgba(255,196,107,.28)}
.btn-line{border:1.5px solid rgba(255,226,211,.55);color:var(--peach)}

/* ---------- Pembuka (gerbang interaksi pertama untuk membuka blokir audio) ---------- */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:28px;text-align:center;color:var(--peach);
  background:radial-gradient(ellipse at 50% 38%,#5b2147 0%,#2a1236 55%,var(--night) 100%);
  transition:opacity 1.1s var(--ease),visibility 1.1s}
.gate.gone{opacity:0;visibility:hidden}
.gate-inner{max-width:400px}
.gate-note{font-size:24px;color:var(--gold);transform:rotate(-2deg)}
.gate h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,8.5vw,42px);line-height:1.15;margin:8px 0 38px}
.seal-btn{position:relative;width:112px;height:112px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:44px;color:#ffe2d3;
  background:radial-gradient(circle at 35% 30%,#e0476f,var(--berry) 55%,#7e1236);
  box-shadow:0 14px 34px rgba(179,35,79,.5),inset 0 -6px 12px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.2);
  transition:transform .3s var(--ease),opacity .3s}
.seal-btn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(255,196,107,.5);animation:ring 2.4s ease-out infinite}
.seal-btn:active{transform:scale(.94)}
.seal-btn[disabled]{opacity:.45;pointer-events:none}
.seal-btn[disabled]::after{animation:none;opacity:0}
.gate-hint{margin-top:26px;font-family:var(--hand);font-size:20px;color:rgba(255,226,211,.8);min-height:30px}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:70px 22px 90px;overflow:hidden;
  background:radial-gradient(circle at 82% 6%,rgba(255,196,107,.7),rgba(255,196,107,0) 46%)}
.hero-inner{position:relative;z-index:2;max-width:760px}
.hero-hand{font-size:clamp(26px,7vw,36px);color:var(--berry);transform:rotate(-3deg);display:inline-block}
.hero-name{font-family:var(--display);font-weight:700;font-size:clamp(54px,20vw,136px);line-height:.98;letter-spacing:-.03em;color:var(--plum);overflow-wrap:anywhere;margin:6px 0 18px}
.hero-sub{max-width:26em;margin-inline:auto;color:rgba(43,18,53,.8)}
.scroll-cue{position:absolute;left:0;right:0;bottom:22px;text-align:center;text-decoration:none;font-size:30px;color:var(--berry);z-index:2}
.scroll-cue span{display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.floaters{position:absolute;inset:0;pointer-events:none;z-index:1}
.floaters span{position:absolute;bottom:-40px;left:var(--x);font-size:var(--sz);color:var(--berry);opacity:0;animation:floatUp var(--dur) linear var(--del) infinite}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.3}100%{transform:translate(var(--dx),-110dvh) rotate(40deg);opacity:0}}

/* Satu-satunya gerakan "masuk": urutan hero setelah segel dibuka */
.rise{opacity:0}
body.opened .rise{animation:rise 1.5s var(--ease) both;animation-delay:calc(.45s + var(--i,0) * .22s)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ---------- Pengantar ---------- */
.intro-text p{font-family:var(--display);font-weight:400;font-size:clamp(20px,5.2vw,24px);line-height:1.55;margin-top:18px;max-width:30em}
.intro-text p:first-child{margin-top:0}

/* ---------- Galeri ---------- */
.gallery{position:relative;margin-top:30px}
.rail{--card:min(76vw,290px);display:flex;gap:26px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px calc((100% - var(--card)) / 2) 30px;scrollbar-width:none;-webkit-overflow-scrolling:touch;outline-offset:-4px}
.rail::-webkit-scrollbar{display:none}
.shot{position:relative;flex:0 0 var(--card);scroll-snap-align:center;background:#fffaf5;padding:10px 10px 8px;border-radius:2px;box-shadow:0 14px 30px rgba(43,18,53,.2);transform:rotate(var(--tilt,-2deg)) scale(.96);transition:transform .6s var(--ease)}
.shot:nth-child(even){--tilt:2deg;--tape:4deg}
.shot.active{transform:rotate(0) scale(1.02)}
.shot::before{content:"";position:absolute;top:-13px;left:50%;width:86px;height:26px;background:rgba(255,214,130,.78);box-shadow:0 1px 3px rgba(0,0,0,.12);transform:translateX(-50%) rotate(var(--tape,-3deg));z-index:2}
.shot .ph{aspect-ratio:4/5;overflow:hidden;background:var(--rose);cursor:zoom-in}
.shot .ph img{width:100%;height:100%;object-fit:cover}
.shot .ph.is-placeholder{cursor:default;display:grid;place-items:center;background:linear-gradient(160deg,var(--rose),var(--orchid))}
.ph-fallback{display:grid;gap:4px;justify-items:center;color:var(--plum);font-family:var(--hand);font-size:20px;opacity:.75}
.ph-fallback b{font-size:34px;font-weight:400}
.shot figcaption{font-family:var(--hand);font-size:21px;line-height:1.25;text-align:center;color:var(--plum);padding:12px 6px 8px;min-height:3.2em}
.dots{display:flex;justify-content:center;gap:8px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(43,18,53,.25);transition:all .4s var(--ease)}
.dot.active{width:24px;border-radius:5px;background:var(--berry)}
.rail-btn{display:none;position:absolute;top:44%;width:46px;height:46px;border-radius:50%;place-items:center;font-size:26px;background:rgba(255,250,245,.9);box-shadow:0 6px 16px rgba(43,18,53,.2);z-index:3}
.rail-btn.prev{left:max(12px,calc(50% - 440px))}
.rail-btn.next{right:max(12px,calc(50% - 440px))}
@media (min-width:760px){.rail-btn{display:grid}}

.lightbox{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(27,13,38,.95);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.lightbox.show{opacity:1;visibility:visible}
.lightbox figure{max-width:min(92vw,720px);text-align:center}
.lightbox img{max-height:72dvh;margin:auto;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox figcaption{font-family:var(--hand);font-size:24px;color:var(--gold);margin-top:16px}
.lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:var(--peach);background:rgba(255,226,211,.12)}
.lb-close{top:max(16px,env(safe-area-inset-top));right:16px}
.lb-prev{left:12px;top:50%;margin-top:-24px}
.lb-next{right:12px;top:50%;margin-top:-24px}

/* ---------- Doa & pesan ---------- */
.board{display:grid;gap:34px;margin-top:34px}
.sticky{position:relative;background:var(--paper,#fff3a8);padding:28px 22px 18px;border-radius:3px;box-shadow:0 10px 22px rgba(43,18,53,.16);width:min(100%,420px);transform:rotate(var(--r,-1.4deg))}
.sticky::before{content:"";position:absolute;top:-11px;left:50%;width:68px;height:22px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.08);transform:translateX(-50%) rotate(-2deg)}
.sticky-text{font-family:var(--hand);font-size:20px;line-height:1.55;white-space:pre-line}
.sticky-who{margin-top:14px;font-family:var(--display);font-style:italic;font-size:17px;line-height:1.3}
.sticky-who small{display:block;font-family:var(--sans);font-style:normal;font-size:13px;opacity:.65}
.board>.sticky:nth-child(odd){--r:-1.6deg;margin-right:auto}
.board>.sticky:nth-child(even){--r:1.5deg;margin-left:auto}

.letter{width:100%}
.letter-head{position:relative;display:block;width:100%;height:158px;border-radius:10px;background:#fff0f2;box-shadow:0 14px 30px rgba(43,18,53,.18);perspective:700px;overflow:visible;text-align:center}
.letter-head .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#ffd3dc;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0;transform-origin:top;transition:transform .8s var(--ease),opacity .6s .15s}
.letter-head .seal{position:absolute;left:50%;top:calc(62% - 26px);width:52px;height:52px;margin-left:-26px;border-radius:50%;display:grid;place-items:center;color:#ffe2d3;font-size:22px;background:radial-gradient(circle at 35% 30%,#e0476f,var(--berry) 60%,#7e1236);box-shadow:0 5px 12px rgba(179,35,79,.45);transition:opacity .5s,transform .5s}
.letter-head .env-label{position:absolute;left:0;right:0;bottom:12px}
.letter-head strong{display:block;font-family:var(--hand);font-weight:400;font-size:23px;line-height:1.2;color:var(--plum)}
.letter-head small{font-size:13px;color:var(--berry)}
.letter.open .flap{transform:rotateX(95deg);opacity:0}
.letter.open .seal{opacity:0;transform:scale(.6)}
.letter-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .9s var(--ease)}
.letter.open .letter-body{grid-template-rows:1fr}
.letter-body>div{overflow:hidden}
.paper{margin-top:-4px;padding:30px 24px 26px;background-color:#fffdf8;border-radius:0 0 10px 10px;box-shadow:0 14px 30px rgba(43,18,53,.14);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(179,35,79,.14) 31px 32px);background-position:0 30px}
.paper p{font-family:var(--hand);font-size:20px;line-height:32px;white-space:pre-line}
.paper .sign{font-size:26px;color:var(--berry);margin-top:6px;text-align:right}

/* ---------- Malam: tiup lilin ---------- */
.night{position:relative;overflow:hidden;min-height:100dvh;padding:150px 20px 54px;margin-top:-1px;text-align:center;color:var(--peach);
  background:linear-gradient(180deg,rgba(27,13,38,0) 0,var(--night) 24%,#12071a 100%)}
.night::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(255,140,170,.34),rgba(255,140,170,0) 65%);opacity:0;transition:opacity 2.2s}
.night.done::after{opacity:1}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.8;animation:twinkle 4s ease-in-out infinite alternate;
  background-image:
  radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 28% 58%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 44% 14%,#ffe9c9 50%,transparent 51%),
  radial-gradient(1px 1px at 63% 40%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 78% 20%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 88% 66%,#ffe9c9 50%,transparent 51%),
  radial-gradient(1px 1px at 8% 80%,#fff 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 54% 86%,#fff 50%,transparent 51%)}
@keyframes twinkle{from{opacity:.3}to{opacity:.9}}
.night-inner{position:relative;z-index:2;max-width:520px;margin-inline:auto}
.night.done .only-pre{display:none}
.night:not(.done) .only-post{display:none}
.night.done .only-post{animation:rise 1.6s var(--ease) both}
.cake-wrap{position:relative;width:min(88vw,360px);margin:26px auto 10px}
.cake-wrap::before{content:"";position:absolute;left:-20%;right:-20%;top:-16%;height:70%;background:radial-gradient(ellipse at 50% 60%,rgba(255,196,107,.4),rgba(255,196,107,0) 68%);transition:opacity 1.2s;pointer-events:none}
.cake-wrap.blown::before{opacity:0}
.cake{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 22px 34px rgba(0,0,0,.5))}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.1s ease-in-out var(--fd,0s) infinite alternate;transition:opacity .35s,transform .35s}
.flame-glow{animation:glow 1.6s ease-in-out var(--fd,0s) infinite alternate;transition:opacity .35s}
@keyframes flicker{0%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.94,1.08) rotate(1.5deg)}100%{transform:scale(1.04,.95) rotate(-1deg)}}
@keyframes flickerWind{0%{transform:scale(.9,.8) rotate(-14deg)}100%{transform:scale(.9,.9) rotate(12deg)}}
@keyframes glow{from{opacity:.65}to{opacity:1}}
.cake.windy .flame{animation:flickerWind .16s ease-in-out infinite alternate}
.cake.blown .flame{animation:none;opacity:0;transform:scale(.1)}
.cake.blown .flame-glow{animation:none;opacity:0}
.smoke{opacity:0;fill:none;stroke:#e8d6e6;stroke-width:2.4;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%}
.cake.blown .smoke{animation:smoke 2.8s ease-out var(--sd,0s) forwards}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scaleY(.5)}22%{opacity:.85}100%{opacity:0;transform:translateY(-38px) scaleY(1.15)}}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
.hint{margin-top:16px;min-height:2.4em;font-family:var(--hand);font-size:19px;color:rgba(255,226,211,.82)}
.sign{margin-top:52px;font-family:var(--hand);font-size:18px;color:rgba(255,226,211,.55)}

/* ---------- Pemutar musik, toast, confetti ---------- */
.yt-host{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;overflow:hidden;z-index:-1}
.music-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;width:48px;height:48px;border-radius:50%;display:none;place-items:center;background:rgba(27,13,38,.9);box-shadow:0 8px 22px rgba(0,0,0,.35)}
body.opened .music-fab{display:grid}
.eq{display:flex;gap:3px;align-items:flex-end;height:16px}
.eq i{display:block;width:3px;height:28%;background:var(--gold);border-radius:2px}
.music-fab.playing .eq i{animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}
.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:120;max-width:min(92vw,420px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--night);color:var(--peach);font-size:15px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.4);transform:translate(-50%,24px);opacity:0;visibility:hidden;transition:all .4s var(--ease)}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast button{flex:none;padding:8px 14px;border-radius:999px;background:var(--gold);color:var(--night);font-weight:600;font-size:14px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}

@media (min-width:760px){
  body{font-size:18px}
  .section{padding:120px 0}
  .board{gap:42px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<!-- =====================================================================
     BAGIAN 2 - STRUKTUR (HTML)
     Semua teks & foto diisi otomatis dari CONFIG di bagian JavaScript.
     ===================================================================== -->
<body class="locked">
<noscript><p style="padding:24px;color:#fff;background:#1b0d26">Halaman ini butuh JavaScript supaya bisa dibuka.</p></noscript>

<div class="yt-host" aria-hidden="true"><div id="yt"></div></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<section class="gate" id="gate" aria-label="Pembuka">
  <div class="gate-inner">
    <p class="gate-note">Untuk <span id="gateName"></span>,</p>
    <h1 id="gateTitle"></h1>
    <button class="seal-btn" id="startBtn" type="button" aria-label="Buka kejutan" disabled><span>♥</span></button>
    <p class="gate-hint" id="gateHint" aria-live="polite"></p>
  </div>
</section>

<button class="music-fab" id="musicFab" type="button" aria-label="Putar atau jeda musik"><span class="eq"><i></i><i></i><i></i></span></button>

<main>
  <header class="hero" id="top">
    <div class="floaters" id="floaters" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="hero-hand rise" style="--i:0">Selamat Ulang Tahun,</p>
      <h1 class="hero-name rise" style="--i:1" id="heroName"></h1>
      <p class="hero-sub rise" style="--i:3" id="heroSub"></p>
    </div>
    <a class="scroll-cue rise" style="--i:5" href="#intro" aria-label="Gulir ke bawah"><span>⌄</span></a>
  </header>

  <section class="section" id="intro">
    <div class="wrap">
      <p class="marg">sebelum mulai</p>
      <h2 class="title">Untukmu, hari ini</h2>
      <div class="intro-text" id="introText" style="margin-top:22px"></div>
    </div>
  </section>

  <section class="section" id="gallery">
    <div class="wrap">
      <p class="marg">foto-foto favoritku</p>
      <h2 class="title">Potongan cerita kita</h2>
      <p class="lead">Geser ke samping, ketuk foto untuk memperbesar.</p>
    </div>
    <div class="gallery">
      <div class="rail" id="rail" tabindex="0" aria-label="Galeri foto kenangan"></div>
      <button class="rail-btn prev" id="railPrev" type="button" aria-label="Foto sebelumnya">‹</button>
      <button class="rail-btn next" id="railNext" type="button" aria-label="Foto berikutnya">›</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
  </section>

  <section class="section" id="wishes">
    <div class="wrap">
      <p class="marg">dari orang-orang yang menyayangimu</p>
      <h2 class="title">Doa dan harapan</h2>
      <div class="board" id="board"></div>
    </div>
  </section>

  <section class="night" id="night">
    <div class="stars" aria-hidden="true"></div>
    <div class="night-inner">
      <div class="only-pre">
        <p class="marg gold">puncak acaranya</p>
        <h2 class="title light" id="candleTitle"></h2>
        <p class="lead light" id="candleText"></p>
      </div>
      <div class="only-post">
        <p class="marg gold" id="finaleHand"></p>
        <h2 class="title light" id="finaleTitle"></h2>
        <p class="lead light" id="finaleText"></p>
      </div>

      <div class="cake-wrap" id="cakeWrap">
        <svg id="cake" class="cake" viewBox="0 0 320 280" role="img" aria-label="Kue ulang tahun dengan lima lilin"></svg>
      </div>

      <div class="actions only-pre">
        <button class="btn btn-gold" id="micBtn" type="button">Tiup lewat mikrofon</button>
        <button class="btn btn-line" id="tapBtn" type="button">Ketuk untuk meniup</button>
      </div>

/* ---------------------------------------------------------------------
   Musik - satu pemain YouTube IFrame.
   Satu pemain dipakai untuk kedua lagu (loadVideoById) supaya setelah
   "dibuka" lewat ketukan pertama, browser seluler (iOS/Android) tidak
   memblokir pergantian lagu saat lilin ditiup.
   --------------------------------------------------------------------- */
const Music = (() => {
  const fab = $('#musicFab');
  let yt = null, ready = false, current = 'main', fadeT = null, chkT = null, hushed = false, errShown = false;
  const readyCbs = [];

  function onReady(cb) { ready ? cb() : readyCbs.push(cb); }

  function load() {
    window.onYouTubeIframeAPIReady = create;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.async = true;
    document.head.appendChild(s);
  }

  function create() {
    const vars = { playsinline: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, iv_load_policy: 3 };
    if (location.protocol.indexOf('http') === 0) vars.origin = location.origin;
    yt = new YT.Player('yt', {
      width: 200, height: 200, videoId: CONFIG.music.main, playerVars: vars,
      events: {
        onReady: () => { ready = true; readyCbs.splice(0).forEach(f => f()); },
        onStateChange: e => {
          const s = e.data;
          fab.classList.toggle('playing', s === 1 || s === 3);
          if (s === 0) { yt.seekTo(0, true); yt.playVideo(); }   // ulang terus
        },
        onError: e => {
          if (errShown) return;
          errShown = true;
          Toast.show(`Lagu tidak bisa diputar di website (kode ${e.data}). Coba ganti dengan versi video lain.`, null, null, 9000);
        }
      }
    });
  }

  function fade(to, ms = 1500, done) {
    clearInterval(fadeT);
    const from = yt.getVolume();
    const steps = Math.max(1, Math.round(ms / 50));
    let i = 0;
    fadeT = setInterval(() => {
      i++;
      yt.setVolume(Math.round(from + (to - from) * i / steps));
      if (i >= steps) { clearInterval(fadeT); if (done) done(); }
    }, 50);
  }

  // Harus dipanggil langsung dari ketukan pengguna (aturan autoplay browser)
  function start() {
    if (!ready) return;
    yt.setVolume(0);
    yt.playVideo();
    fade(CONFIG.volume.main, 3500);
  }

  function toggle() {
    if (!ready) return;
    const s = yt.getPlayerState();
    if (s === 1 || s === 3) yt.pauseVideo();
    else { yt.setVolume(CONFIG.volume[current]); yt.playVideo(); }
  }

  // Diamkan musik sementara (dipakai saat mikrofon mendengarkan tiupan)
  function hush() {
    if (!ready) return;
    hushed = yt.getPlayerState() === 1;
    if (hushed) fade(0, 700, () => yt.pauseVideo());
  }
  function unhush() {
    if (!ready || !hushed) return;
    hushed = false;
    yt.playVideo();
    fade(CONFIG.volume[current], 1500);
  }

  function switchTo(key) {
    if (!ready) return;
       if (!CONFIG.music[key] || key === current) { unhush(); return; }   // tanpa lagu kedua: lagu utama lanjut
    current = key;
    hushed = false;
    yt.loadVideoById({ videoId: CONFIG.music[key], startSeconds: 0 });
    yt.setVolume(0);
    fade(CONFIG.volume[key], 2500);
    clearTimeout(chkT);
    chkT = setTimeout(() => {
      const s = yt.getPlayerState();
      if (s !== 1 && s !== 3) Toast.show('Ketuk untuk memutar lagunya', 'Putar', () => { yt.setVolume(CONFIG.volume[key]); yt.playVideo(); }, 12000);
    }, 2200);
  }

  fab.addEventListener('click', toggle);
  load();
  return { onReady, start, switchTo, hush, unhush };
})();

/* ---------------------------------------------------------------------
   Confetti
   --------------------------------------------------------------------- */
const Confetti = (() => {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const colors = ['#ffc4d0', '#ff8fa8', '#ffc46b', '#fff1e0', '#eebfe3', '#e0476f'];
  let parts = [], raf = null, W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.round(innerWidth * dpr);
    H = cv.height = Math.round(innerHeight * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: W * (0.15 + Math.random() * 0.7), y: H * 0.42,
        vx: (Math.random() - 0.5) * 15 * dpr, vy: (-Math.random() * 15 - 4) * dpr,
        g: 0.3 * dpr, w: (6 + Math.random() * 6) * dpr, h: (9 + Math.random() * 8) * dpr,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        c: colors[Math.floor(Math.random() * colors.length)], heart: Math.random() < 0.22
      });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.y < H + 60 * dpr);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      if (p.heart) { ctx.font = `${p.w * 2.2}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('♥', 0, 0); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = null; ctx.clearRect(0, 0, W, H); }
  }

  function celebrate() {
    burst(150);
    setTimeout(() => burst(110), 650);
    setTimeout(() => burst(90), 1400);
  }
  return { celebrate };
})();

/* ---------------------------------------------------------------------
   Galeri foto + lightbox
   --------------------------------------------------------------------- */
(function gallery() {
  const rail = $('#rail'), dots = $('#dots');
  const lb = $('#lightbox'), lbImg = $('#lbImg'), lbCap = $('#lbCap');
  const failed = new Set();
  const total = CONFIG.photos.length;
  let lbIndex = 0, touchX = null;

  CONFIG.photos.forEach((p, i) => {
    const fig = el('figure', 'shot');
    const ph = el('div', 'ph');
    const img = new Image();
    img.alt = p.caption || `Kenangan ${i + 1}`;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.addEventListener('error', () => {
      failed.add(i);
      ph.classList.add('is-placeholder');
      const fb = el('div', 'ph-fallback');
      fb.append(el('b', null, '♥'), el('span', null, `Foto ${i + 1}`));
      ph.replaceChildren(fb);
    });
    img.src = p.src;
    ph.appendChild(img);
    ph.addEventListener('click', () => { if (!failed.has(i)) openLb(i); });
    fig.append(ph, el('figcaption', null, p.caption || ''));
    rail.appendChild(fig);
    dots.appendChild(el('span', 'dot'));
  });

  // Penanda foto aktif
  const cards = [...rail.children], dotEls = [...dots.children];
  function setActive(idx) {
    cards.forEach((c, i) => c.classList.toggle('active', i === idx));
    dotEls.forEach((d, i) => d.classList.toggle('active', i === idx));
  }
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) setActive(cards.indexOf(e.target)); });
  }, { root: rail, threshold: 0.6 });
  cards.forEach(c => io.observe(c));
  setActive(0);

  function slide(dir) {
    const step = cards.length > 1 ? cards[1].offsetLeft - cards[0].offsetLeft : rail.clientWidth;
    rail.scrollBy({ left: dir * step, behavior: 'smooth' });
  }
  $('#railPrev').addEventListener('click', () => slide(-1));
  $('#railNext').addEventListener('click', () => slide(1));

  function show(i) {
    lbIndex = i;
    lbImg.src = CONFIG.photos[i].src;
    lbImg.alt = CONFIG.photos[i].caption || '';
    lbCap.textContent = CONFIG.photos[i].caption || '';
  }
  function openLb(i) { show(i); lb.classList.add('show'); lb.setAttribute('aria-hidden', 'false'); }
  function closeLb() { lb.classList.remove('show'); lb.setAttribute('aria-hidden', 'true'); }
  function step(dir) {
    let n = lbIndex;
    for (let k = 0; k < total; k++) { n = (n + dir + total) % total; if (!failed.has(n)) break; }
    show(n);
  }
  $('#lbClose').addEventListener('click', closeLb);
  $('#lbPrev').addEventListener('click', () => step(-1));
  $('#lbNext').addEventListener('click', () => step(1));
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  lb.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    touchX = null;
  });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('show')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
})();

const Candles = (() => {

  const micBtn = $('#micBtn'), tapBtn = $('#tapBtn'), hint = $('#blowHint');
  let blown = false, listening = false, stream = null, actx = null, raf = null;

  // Gambar kue (SVG) - lima lilin
  (function drawCake() {

      <path d="M40,168 H280 V184 q-20,18 -40,0 t-40,0 t-40,0 t-40,0 t-40,0 t-40,0 Z" fill="#fff1e8"/>
      <rect x="40" y="236" width="240" height="6" fill="#ffc46b"/>
      <g fill="#fff1e8"><circle cx="70" cy="214" r="4"/><circle cx="106" cy="222" r="4"/><circle cx="142" cy="214" r="4"/><circle cx="178" cy="222" r="4"/><circle cx="214" cy="214" r="4"/><circle cx="250" cy="222" r="4"/></g>

      ${candles}`;
  })();

  function setHint(t) { hint.textContent = t; }

  function blow() {
    if (blown) return;
    blown = true;
    stopMic();
    cake.classList.remove('windy');
    cake.classList.add('blown');
    wrap.classList.add('blown');
    if (navigator.vibrate) navigator.vibrate(80);
    Music.switchTo('candle');                       // lagu kedua langsung dipicu
    setTimeout(() => { night.classList.add('done'); Confetti.celebrate(); }, 1100);
  }

  function stopMic() {
    listening = false;
    cancelAnimationFrame(raf);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (actx) { actx.close().catch(() => {}); actx = null; }
  }

  async function listen() {
    if (blown || listening) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setHint('Mikrofon tidak tersedia di perangkat ini. Ketuk tombol "Ketuk untuk meniup" saja ya.');
      micBtn.hidden = true;
      return;
    }
    micBtn.disabled = true;
    actx = new AC();                                // dibuat langsung dari ketukan (aturan iOS)
    if (actx.resume) actx.resume();
    Music.hush();                                   // musik dihentikan sementara agar tidak terdeteksi sebagai tiupan
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (err) {
      stopMic();
      Music.unhush();
      micBtn.disabled = false;
      setHint('Izin mikrofon ditolak. Tidak apa-apa, ketuk tombol "Ketuk untuk meniup" saja.');
      return;
    }
    const analyser = actx.createAnalyser();
    analyser.fftSize = 1024;
    actx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.fftSize);
    listening = true;
    setHint('Tiup pelan ke arah mikrofon HP...');

    const t0 = performance.now();
    let last = t0, base = 0, held = 0, slowHint = false;
    (function loop(t) {
      if (!listening) return;
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const rms = Math.sqrt(sum / buf.length);
      const dt = t - last; last = t;
      if (t - t0 < 700) {
        base = Math.max(base, rms);                 // kalibrasi suara ruangan
      } else {
        const thr = Math.max(CONFIG.blow.threshold, base * 2.5 + 0.05);
        cake.classList.toggle('windy', rms > thr * 0.5);
        if (rms > thr) held += dt; else held = Math.max(0, held - dt * 1.5);
        if (held >= CONFIG.blow.hold) { blow(); return; }
        if (!slowHint && t - t0 > 20000) { slowHint = true; setHint('Kalau susah, ketuk tombol "Ketuk untuk meniup" ya.'); }
      }
      raf = requestAnimationFrame(loop);
    })(t0);
  }

  function reset() {
    blown = false;
    night.classList.remove('done');
    cake.classList.remove('blown', 'windy');
    wrap.classList.remove('blown');
    micBtn.disabled = false;
    setHint('');
    Music.switchTo('main');
  }

  micBtn.addEventListener('click', listen);
  tapBtn.addEventListener('click', blow);
  $('#relightBtn').addEventListener('click', reset);

  // Jika pengguna menggulir menjauh saat mikrofon aktif, matikan mikrofon & lanjutkan musik
  new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting && listening) {
        stopMic();
        cake.classList.remove('windy');
        micBtn.disabled = false;
        setHint('');
        Music.unhush();
      }
    });
  }, { threshold: 0 }).observe(night);

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) micBtn.hidden = true;
  return { reset };
})();

/* ---------------------------------------------------------------------
   Gerbang pembuka: ketukan pertama membuka blokir audio browser
   --------------------------------------------------------------------- */
(function gate() {
  const gateEl = $('#gate'), btn = $('#startBtn'), hint = $('#gateHint');
  let enabled = false;

  function enable(msg) {
    if (enabled) return;
    enabled = true;
    btn.disabled = false;
    hint.textContent = msg || 'nyalakan suara, lalu sentuh segelnya';
  }
  hint.textContent = 'menyiapkan lagu...';
  Music.onReady(() => enable());
  setTimeout(() => enable('sentuh segelnya untuk membuka'), 7000);   // tetap bisa dibuka walau musik gagal dimuat

  btn.addEventListener('click', () => {
    Music.start();                                  // dipanggil langsung dari ketukan pengguna
    gateEl.classList.add('gone');
    document.body.classList.remove('locked');
    document.body.classList.add('opened');
    window.scrollTo(0, 0);

    // kelopak & hati melayang di hero
    const box = $('#floaters');
    const sym = ['♥', '♡', '✿', '✦'];
    for (let i = 0; i < 16; i++) {
      const s = el('span', null, sym[i % sym.length]);
      s.style.setProperty('--x', (Math.random() * 100).toFixed(1) + '%');
      s.style.setProperty('--sz', (12 + Math.random() * 16).toFixed(0) + 'px');
      s.style.setProperty('--dur', (10 + Math.random() * 9).toFixed(1) + 's');
      s.style.setProperty('--del', (-Math.random() * 14).toFixed(1) + 's');
      s.style.setProperty('--dx', ((Math.random() - 0.5) * 80).toFixed(0) + 'px');
      box.appendChild(s);
    }
  }, { once: true });
})();

})();
</script>
